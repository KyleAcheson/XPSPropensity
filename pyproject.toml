[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpsoverlaps"
version = "0.1.0"
description = "Program-neutral electronic-structure overlap and shake-down analysis"
readme = "README.MD"
requires-python = ">=3.9"
dependencies = [
    "h5py>=3.8",
    "jsonschema>=4.18",
    "numpy>=1.23",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
xpsoverlaps = "xpsoverlaps.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xpsoverlaps = ["input_schema.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
